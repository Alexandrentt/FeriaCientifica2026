; ============================================================
;  Panel de sensores — Arduino UNO R4 WiFi (RA4M1 + ESP32-S3)
;
;  Compilar:      pio run
;  Flashear:      pio run -t upload        (placa por USB-C)
;  Monitor serie: pio device monitor       (115200 baud)
; ============================================================

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
